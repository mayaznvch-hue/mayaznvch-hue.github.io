<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Электрички от Реутова · Реутов по делу</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common.css">
<style>
  .big { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 0 0 22px; }
  .big .card { padding: 16px; }
  .big .t { font-size: 46px; font-weight: 600; letter-spacing: -1.5px; line-height: 1; }
  .big .in { color: var(--accent); font-weight: 600; margin: 6px 0 4px; }
  .row { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: baseline; }
  .row .tm { font-weight: 600; font-variant-numeric: tabular-nums; font-size: 18px; }
  .row.gone { opacity: .4; }
  .row .left { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .walkset { display: flex; gap: 8px; align-items: center; font-size: 14px; }
  @media (max-width: 760px) { .big { grid-template-columns: 1fr; } .big .card:not(:first-child) { display: none; } .big .t { font-size: 40px; } }
</style>
</head>
<body data-source='Расписание: <a href="https://www.tutu.ru/station.php?nnst=56708">tutu.ru</a>, обновляется раз в 10 минут. Задержки и отмены tutu публикует не всегда, перед поездкой загляните на сайт ЦППК.'>
<main class="wrap">
  <h1>Когда ближайшая электричка</h1>
  <p class="lead">Станция Реутово, Горьковское направление. Сразу видно, успеете ли вы, если выйти из дома прямо сейчас.</p>
  <div class="bar">
    <div class="seg" id="dir">
      <button data-dir="to-moscow" aria-pressed="true">В Москву</button>
      <button data-dir="east">Из Москвы, на восток</button>
      <button data-dir="from-moscow">Домой с Курского</button>
    </div>
    <label class="walkset">До станции идти <select id="walk">
      <option value="5">5 мин</option><option value="10" selected>10 мин</option><option value="15">15 мин</option><option value="20">20 мин</option><option value="25">25 мин</option>
    </select></label>
  </div>
  <div id="note"></div>
  <div class="big" id="big"></div>
  <div class="bar"><span class="muted small" id="meta"></span></div>
  <div class="list" id="list"><div class="skeleton">Загружаю расписание…</div></div>
</main>
<script type="module">
import { header, api, $, esc, hhmm, minsText } from '../common.js';
header('Электрички');

let dir = localStorage.getItem('rt-dir') || 'to-moscow', data = null;
$('#walk').value = localStorage.getItem('rt-walk') || '10';
const pressed = () => document.querySelectorAll('#dir button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.dir === dir));
pressed();
document.querySelectorAll('#dir button').forEach((b) => (b.onclick = () => { dir = b.dataset.dir; localStorage.setItem('rt-dir', dir); pressed(); load(); }));
$('#walk').onchange = () => { localStorage.setItem('rt-walk', $('#walk').value); draw(); };

async function load() {
  $('#list').innerHTML = '<div class="skeleton">Загружаю расписание…</div>';
  $('#big').innerHTML = '';
  try {
    data = await api('/api/trains?dir=' + dir);
    $('#note').innerHTML = data.stale ? '<div class="status">tutu.ru сейчас не отвечает, показываю расписание из последней удачной загрузки.</div>' : '';
    draw();
  } catch (e) {
    $('#list').innerHTML = '';
    $('#note').innerHTML = `<div class="status err">Не получилось загрузить расписание: ${esc(e.message)}. Попробуйте обновить страницу через минуту.</div>`;
  }
}

function draw() {
  if (!data) return;
  const now = Date.now(), walk = +$('#walk').value;
  const items = data.items.map((t) => ({ ...t, ms: new Date(t.dep).getTime() }));
  const future = items.filter((t) => t.ms > now - 60000);
  const catchable = future.filter((t) => t.ms - now >= walk * 60000);
  const fromStation = dir === 'from-moscow' ? 'с Курского вокзала' : 'со станции Реутово';

  $('#big').innerHTML = catchable.slice(0, 3).map((t, i) => {
    const leave = (t.ms - now) / 60000 - walk;
    const go = leave < 1 ? 'Выходите прямо сейчас' : `Выйти через ${minsText(leave)}`;
    return `<div class="card">
      <div class="muted small">${i === 0 ? 'Успеваете на' : 'Следующая'}</div>
      <div class="t">${hhmm(t.dep)}</div>
      <div class="in">${go}</div>
      <div class="small">${esc(t.kind)} № ${esc(t.number)}, до станции ${esc(t.routeTo)}</div>
      ${t.arr ? `<div class="small muted">прибытие в ${hhmm(t.arr)}, в пути ${t.min} мин</div>` : ''}
    </div>`;
  }).join('') || '<div class="card">На сегодня всё. Первая утренняя электричка будет в списке после полуночи.</div>';

  $('#meta').textContent = `Отправление ${fromStation}. Всего сегодня ${items.length}, осталось ${future.length}. Загружено в ${hhmm(data.fetched)}.`;
  const show = items.filter((t) => t.ms > now - 20 * 60000).slice(0, 40);
  $('#list').innerHTML = show.map((t) => {
    const left = Math.round((t.ms - now) / 60000);
    const late = left < walk;
    return `<div class="row ${left < 0 ? 'gone' : ''}">
      <span class="tm">${hhmm(t.dep)}</span>
      <span>${esc(t.routeFrom)} → <b style="font-weight:600">${esc(t.routeTo)}</b>
        <span class="small muted">· ${esc(t.kind)} № ${esc(t.number)}${t.note ? ' · ' + esc(t.note) : ''}</span></span>
      <span class="left small ${late && left >= 0 ? 'muted' : ''}">${left < 0 ? 'ушла' : left === 0 ? 'сейчас' : late ? `${left} мин, не успеть` : `через ${minsText(left)}`}</span>
    </div>`;
  }).join('') || '<div class="skeleton">Больше электричек сегодня нет.</div>';
}
load();
setInterval(draw, 30000);
setInterval(load, 10 * 60000);
</script>
</body></html>
