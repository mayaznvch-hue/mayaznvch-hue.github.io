<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Аптеки · Реутов по делу</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/vendor/leaflet.css"><link rel="stylesheet" href="../common.css">
<script src="/vendor/leaflet.js"></script>
</head>
<body data-source='Точки и часы работы: <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>, выгрузка от 1 ноября 2026. Маршруты: OSRM. Если что-то закрылось или переехало, поправить можно прямо на openstreetmap.org.'>
<main class="wrap">
<h1>Какая аптека открыта прямо сейчас</h1>
<p class="lead">Аптеки Реутова по расстоянию от вас. Закрытые бледнее. Часы взяты из OpenStreetMap: у трёх аптек из четырёх они заполнены, у остальных лучше позвонить.</p>
<div id="note"></div>
<div class="bar" id="filters"></div>
<div class="split">
  <div><div class="muted small" id="count" style="margin-bottom:6px"></div><div class="list scroll" id="list"><div class="skeleton">Загружаю точки…</div></div></div>
  <div id="map" class="map"></div>
</div>

</main>
<script type="module">
import { header } from '../common.js';
import { poiApp } from '../poimap.js';
header('Аптеки');
poiApp({ hours: true, limit: 50, search: 'Название аптеки',
  unit: (n) => n % 10 === 1 && n % 100 !== 11 ? 'аптека' : [2,3,4].includes(n % 10) && ![12,13,14].includes(n % 100) ? 'аптеки' : 'аптек',
  match: (t) => t.amenity === 'pharmacy' || t.healthcare === 'pharmacy' ? 'ph' : false,
  groups: { ph: { label: 'Аптеки', color: '#2f7a3e' } },
  title: (t) => t.name || t.brand || 'Аптека',
  sub: (t) => { const ph = t.phone || t['contact:phone']; return ph ? ph.split(';').slice(0, 2).map((x) => `<a href="tel:${x.replace(/[^+\d]/g,'')}">${x.trim()}</a>`).join(', ') : '<span class="muted">телефона нет</span>'; },
  empty: 'Под фильтр ничего не попало. Ночью попробуйте снять «только открытые»: круглосуточных в городе немного.' });
</script>
</body></html>
