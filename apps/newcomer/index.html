utov.net/" target="_blank" rel="noopener">reutov.net</a>.'> <main class="wrap"> <h1>Новосёлу Реутова</h1> <p class="lead">Список дел после переезда: регистрация, поликлиника, школа или сад, дом и счётчики, мусор. Отмечайте сделанное — галочки сохранятся в этом браузере.</p> <div class="prog" id="prog"><div class="pbar"><i id="pb"></i></div><div class="ptxt"><span id="pt"></span><span class="muted" id="pp"></span></div></div> <div id="fin"></div> <div id="list"></div> <div class="bar" style="margin-top:18px"><button class="btn" id="reset">Сбросить все отметки</button><span class="small muted" id="msg" role="status"></span></div> </main> <script type="module">import{header as $,esc as i,$ as a,plural as v}from"../common.js";$("Новосёлу Реутова");const l="https://www.gosuslugi.ru/",c=(s,e)=>`<a class="ext" href="${s}" target="_blank" rel="noopener">${e}</a>`,t=(s,e)=>`<a href="${s}">${e}</a>`,d=[{t:"Документы",items:[["reg","Зарегистрироваться по месту жительства или пребывания","Заявление можно подать на Госуслугах или лично. Не откладывайте: по общему правилу жить без регистрации по новому адресу дольше 90 дней — нарушение. Нужен паспорт и документ-основание (собственность, договор найма или согласие собственника). Точный порядок и сроки уточните на Госуслугах.",[c(l,"Госуслуги")]],["addr","Сообщить новый адрес там, где он важен","Работодатель, банк, страховая, школа или сад, ГИБДД (если есть машина — адрес в документах обновляется по правилам ГИБДД, уточните на Госуслугах).",[]],["docs","Записать сроки документов","Паспорт меняют в 20 и 45 лет, у прав и загранпаспорта свой срок. Приложение посчитает даты и сделает напоминание в календарь.",[t("/apps/docs/","Сроки документов и поверок")]]]},{t:"Здоровье",items:[["omc","Прикрепиться к поликлинике","По полису ОМС можно выбрать поликлинику, по общему правилу — не чаще раза в год (кроме переезда). Заявление подают в регистратуре выбранной поликлиники или через Госуслуги. Детей прикрепляют к детской поликлинике отдельно."
