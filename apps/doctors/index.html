<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Поликлиники и врачи · Реутов по делу</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/vendor/leaflet.css"><link rel="stylesheet" href="../common.css">
<script src="/vendor/leaflet.js"></script>
</head>
<body data-source='Точки и часы работы: <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>, выгрузка от 1 ноября 2026. Маршруты: OSRM. Если что-то закрылось или переехало, поправить можно прямо на openstreetmap.org.'>
<main class="wrap">
<h1>Поликлиники, травмпункты, стоматологии</h1>
<p class="lead">Государственные и частные медучреждения Реутова. Записаться к врачу в поликлинику по ОМС можно на Госуслугах или по телефону 122.</p>
<div id="note"></div>
<div class="bar" id="filters"></div>
<div class="split">
  <div><div class="muted small" id="count" style="margin-bottom:6px"></div><div class="list scroll" id="list"><div class="skeleton">Загружаю точки…</div></div></div>
  <div id="map" class="map"></div>
</div>
<p class="small muted" style="margin-top:18px">Экстренно: 112 или 103. Вызов врача на дом и запись по ОМС в Подмосковье — единый номер 122.</p>
</main>
<script type="module">
import { header } from '../common.js';
import { poiApp } from '../poimap.js';
header('Медицина');
poiApp({ hours: true, limit: 60, search: 'Название или врач',
  match: (t) => t.amenity === 'hospital' ? 'hos' : t.amenity === 'clinic' ? 'cl' : t.amenity === 'dentist' || t.healthcare === 'dentist' ? 'den' : t.amenity === 'doctors' ? 'doc' : ['laboratory','blood_donation'].includes(t.healthcare) ? 'lab' : false,
  groups: { hos: { label: 'Больницы', color: '#b3261e' }, cl: { label: 'Поликлиники и клиники', color: '#c8461f' }, doc: { label: 'Кабинеты врачей', color: '#b7791f' }, den: { label: 'Стоматологии', color: '#1f6fd1' }, lab: { label: 'Анализы', color: '#7a4fb3' } },
  title: (t) => t.name || t['official_name'] || ({ hospital: 'Больница', clinic: 'Клиника', dentist: 'Стоматология', doctors: 'Врач' })[t.amenity] || 'Медицинский пункт',
  sub: (t) => { const ph = t.phone || t['contact:phone']; const sp = t['healthcare:speciality']; return [sp && esc(sp.split(';').slice(0,3).join(', ')), ph && `<a href="tel:${ph.split(';')[0].replace(/[^+\d]/g,'')}">${esc(ph.split(';')[0])}</a>`].filter(Boolean).join(' · ') || '<span class="muted">контактов нет</span>'; } });
import { esc } from '../common.js';
</script>
</body></html>
